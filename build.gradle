plugins {
    id 'net.neoforged.moddev' version '2.0.99'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        // Geckolib
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        // Curios
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        // Jade
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        // JEI, Patchouli
        url = 'https://maven.blamejared.com/'
    }
    maven {
        // JEI
        url = 'https://modmaven.dev'
    }
}

sourceSets {
    api
    data
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    implementation sourceSets.api.output
    dataImplementation sourceSets.api.output
    dataImplementation sourceSets.main.output
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testImplementation "net.neoforged:testframework:${project.neo_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Required dependencies: Geckolib, Patchouli
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"
    dataRuntimeOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    dataRuntimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Optional dependencies: JEI, Curios, Jade
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    dataCompileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    dataRuntimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.api)
    addModdingDependenciesTo(sourceSets.data)

    mods {
        arsmagicalegacy {
            sourceSet sourceSets.api
            sourceSet sourceSets.main
        }
        arsmagicalegacydata {
            sourceSet sourceSets.api
            sourceSet sourceSets.main
            sourceSet sourceSets.data
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
        }
        data {
            data()
            sourceSet = sourceSets.data
            loadedMods = [neoForge.mods.arsmagicalegacydata]
            programArguments = [
                    '--mod', 'arsmagicalegacy',
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            ]
        }
        server {
            server()
        }
    }

    unitTest {
        enable()
        testedMod = mods.arsmagicalegacy
    }
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            mc_version        : mc_version,
            neo_version       : neo_version,
            loader_version    : loader_version,
            mod_id            : mod_id,
            mod_version       : mod_version,
            mod_name          : mod_name,
            mod_authors       : mod_authors,
            mod_description   : mod_description,
            mod_license       : mod_license,
            geckolib_version  : geckolib_version,
            patchouli_version : patchouli_version,
            curios_version    : curios_version,
            jade_version      : jade_version,
            jei_version       : jei_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

test {
    useJUnitPlatform()
}
